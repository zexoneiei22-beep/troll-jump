name: Build TROLL JUMP APK

on:

  workflow_dispatch:

  push:

    branches: [main]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Extract game project

        run: unzip -o troll-jump-app.zip

      - uses: actions/setup-node@v4

        with:

          node-version: 20

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 17

      - name: Install dependencies

        working-directory: troll-jump-app

        run: npm install

      - name: Prepare Android project

        working-directory: troll-jump-app

        run: node scripts/setup.js android

      - name: Build APK

        working-directory: troll-jump-app

        run: |

          chmod +x android/gradlew

          cd android

          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4

        with:

          name: troll-jump-apk

          path: troll-jump-app/android/app/build/outputs/apk/debug/app-debug.apk
